services:
  - type: web
    name: cooperative-bot
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: cooperative-db
          property: connectionString

databases:
  - name: cooperative-db
    databaseName: cooperativedb
    user: admin
    plan: free
